<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯前端音频格式转换器</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; background: #f9fafb; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; color: #333; margin-bottom: 20px; }
        select, button, input { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; font-size: 16px; }
        button { background: #0051c3; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #003d99; }
        #log { margin-top: 20px; font-size: 14px; color: #666; text-align: left; background: #f1f1f1; padding: 10px; border-radius: 6px; height: 180px; overflow-y: auto; font-family: monospace; line-height: 1.5;}
    </style>
</head>
<body>

<div class="card">
    <h1>🎧 纯前端音频转换器</h1>
    
    <input type="file" id="uploader" accept="audio/*,video/*">
    
    <select id="format-selector">
        <option value="mp3">转换为 MP3</option>
        <option value="wav">转换为 WAV</option>
        <option value="ogg">转换为 OGG</option>
        <option value="aac">转换为 AAC</option>
    </select>

    <button id="convert-btn">开始转换</button>

    <div id="log">等待上传文件...</div>
</div>

<script type="module">
    import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
    import { fetchFile, toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';

    let ffmpeg = null;

    const uploader = document.getElementById('uploader');
    const formatSelector = document.getElementById('format-selector');
    const convertBtn = document.getElementById('convert-btn');
    const logDisplay = document.getElementById('log');

    function appendLog(text, color = '#666') {
        logDisplay.innerHTML += `<div style="color: ${color};">${text}</div>`;
        logDisplay.scrollTop = logDisplay.scrollHeight;
    }

    async function loadFFmpeg() {
        if (ffmpeg && ffmpeg.loaded) return;

        ffmpeg = new FFmpeg();
        
        ffmpeg.on('log', ({ message }) => {
            appendLog(`[FFmpeg] ${message}`);
        });

        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.10/dist/esm';
        
        appendLog('正在下载 core.js...');
        const coreURL = await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript');
        
        appendLog('正在下载 core.wasm (文件较大，请稍候)...');
        const wasmURL = await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm');
        
        appendLog('正在初始化加载引擎...');
        await ffmpeg.load({
            coreURL,
            wasmURL,
        });
        
        appendLog('🎉 引擎启动成功！', 'green');
    }

    convertBtn.addEventListener('click', async () => {
        const file = uploader.files[0];
        if (!file) {
            alert('请先选择一个音频文件！');
            return;
        }

        const targetFormat = formatSelector.value;
        const outputFileName = `output.${targetFormat}`;
        
        convertBtn.disabled = true;
        logDisplay.innerHTML = ''; // 清空旧日志

        try {
            appendLog('正在准备转换环境...');
            await loadFFmpeg();

            // 再次显式校验是否加载成功
            if (!ffmpeg || !ffmpeg.loaded) {
                throw new Error("FFmpeg 实例未成功标记为 loaded");
            }

            const inputFileName = 'input_' + Date.now() + '_' + file.name;
            appendLog(`正在将文件读入内存: ${file.name}...`);
            const fileData = await fetchFile(file);
            await ffmpeg.writeFile(inputFileName, fileData);

            appendLog(`开始转换为 ${targetFormat.toUpperCase()}，处理中...`);
            await ffmpeg.exec(['-i', inputFileName, outputFileName]);

            appendLog('转换完成，正在生成下载文件...');
            const data = await ffmpeg.readFile(outputFileName);

            const blob = new Blob([data.buffer], { type: `audio/${targetFormat}` });
            const downloadUrl = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `converted_${Date.now()}.${targetFormat}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            appendLog('🎉 转换成功！文件已自动下载。', 'green');
        } catch (error) {
            console.error("详细捕获:", error);
            appendLog(`❌ 发生错误: ${error.message || error}`, 'red');
        } finally {
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
