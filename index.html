<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频格式转换器</title>
    <!-- 引入稳定的 FFmpeg.wasm v0.11.6 包装器 -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; background: #f9fafb; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { font-size: 24px; color: #333; margin-bottom: 20px; }
        select, button, input { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; font-size: 16px; }
        button { background: #0051c3; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #003d99; }
        #log { margin-top: 20px; font-size: 14px; color: #666; text-align: left; background: #f1f1f1; padding: 10px; border-radius: 6px; height: 180px; overflow-y: auto; font-family: monospace; line-height: 1.5;}
    </style>
</head>
<body>

<!-- 密码验证卡片 -->
<div class="card" id="auth-card">
    <h1>🔒 请输入访问密码</h1>
    <input type="password" id="pwd-input" placeholder="请输入密码">
    <button id="login-btn">确认进入</button>
    <div id="auth-error" style="color: red; margin-top: 10px; font-size: 14px;"></div>
</div>

<!-- 音频转换功能卡片（默认隐藏） -->
<div class="card" id="converter-card" style="display: none;">
    <h1>🎧 纯前端音频转换器</h1>
    
    <input type="file" id="uploader" accept="audio/*,video/*">
    
    <select id="format-selector">
        <option value="mp3">转换为 MP3</option>
        <option value="wav">转换为 WAV</option>
        <option value="ogg">转换为 OGG</option>
        <option value="aac">转换为 AAC</option>
    </select>

    <button id="convert-btn">开始转换</button>

    <div id="log">等待上传文件...</div>
</div>

<script>
    // --- 密码验证逻辑 ---
    const authCard = document.getElementById('auth-card');
    const converterCard = document.getElementById('converter-card');
    const pwdInput = document.getElementById('pwd-input');
    const loginBtn = document.getElementById('login-btn');
    const authError = document.getElementById('auth-error');

    function handleLogin() {
        // 动态生成当天日期的 8 位数密码 (YYYYMMDD)
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const correctPassword = `${year}${month}${day}`;

        if (pwdInput.value === correctPassword) {
            authCard.style.display = 'none';
            converterCard.style.display = 'block';
        } else {
            authError.textContent = '密码错误，无法进入';
            pwdInput.value = '';
        }
    }

    loginBtn.addEventListener('click', handleLogin);
    pwdInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            handleLogin();
        }
    });


    // --- 原有音频转换逻辑 ---
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;

    const uploader = document.getElementById('uploader');
    const formatSelector = document.getElementById('format-selector');
    const convertBtn = document.getElementById('convert-btn');
    const logDisplay = document.getElementById('log');

    function appendLog(text, color = '#666') {
        logDisplay.innerHTML += `<div style="color: ${color};">${text}</div>`;
        logDisplay.scrollTop = logDisplay.scrollHeight;
    }

    async function getFFmpeg() {
        if (ffmpeg === null) {
            appendLog('正在初始化全新的 FFmpeg 实例...');
            ffmpeg = createFFmpeg({ 
                log: true,
                corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
            });
            
            ffmpeg.setLogger(({ message }) => {
                appendLog(`[FFmpeg] ${message}`);
            });
        }

        if (!ffmpeg.isLoaded()) {
            appendLog('正在加载核心转换引擎（首次加载约需下载几兆文件，请稍候）...');
            await ffmpeg.load();
            appendLog('🎉 引擎启动成功！', 'green');
        }
        
        return ffmpeg;
    }

    convertBtn.addEventListener('click', async () => {
        const file = uploader.files[0];
        if (!file) {
            alert('请先选择一个音频文件！');
            return;
        }

        if (file.size > 50 * 1024 * 1024) {
            alert('文件体积超过 50MB，纯前端转换极易导致浏览器内存耗尽崩溃，请选择较小的音频！');
            return;
        }

        const targetFormat = formatSelector.value;
        const inputFileName = 'input_' + Date.now() + '_' + file.name;
        const outputFileName = `output_${Date.now()}.${targetFormat}`;
        
        convertBtn.disabled = true;
        logDisplay.innerHTML = '';

        try {
            appendLog('正在准备转换环境...');
            const activeFFmpeg = await getFFmpeg();

            appendLog(`正在将文件读入内存: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)...`);
            const fileData = await fetchFile(file);
            
            activeFFmpeg.FS('writeFile', inputFileName, fileData);

            appendLog(`开始转换为 ${targetFormat.toUpperCase()}，处理中...`);
            await activeFFmpeg.run('-i', inputFileName, outputFileName);

            appendLog('转换完成，正在生成下载文件...');
            const data = activeFFmpeg.FS('readFile', outputFileName);

            const blob = new Blob([data.buffer], { type: `audio/${targetFormat}` });
            const downloadUrl = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `converted_${Date.now()}.${targetFormat}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            appendLog('🎉 转换成功！文件已自动下载。', 'green');

            try {
                activeFFmpeg.FS('unlink', inputFileName);
                activeFFmpeg.FS('unlink', outputFileName);
            } catch (e) {}

        } catch (error) {
            console.error("详细捕获:", error);
            appendLog(`❌ 发生错误: ${error.message || error}`, 'red');
            ffmpeg = null;
            appendLog('⚠️ 转换实例已重置，您可以尝试更换更小的文件再次点击转换。', 'orange');
        } finally {
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
